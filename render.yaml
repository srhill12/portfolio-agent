services:
  - type: web
    name: portfolio-agent
    runtime: python
    region: ohio
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.4"
      - key: BASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_DIRECT
        sync: false
      - key: WORKOS_API_KEY
        sync: false
      - key: WORKOS_CLIENT_ID
        sync: false
      - key: WORKOS_COOKIE_PASSWORD
        sync: false
      - key: AUTHKIT_DOMAIN
        sync: false
      - key: FINNHUB_API_KEY
        sync: false

  - type: cron
    name: portfolio-price-snapshot
    runtime: python
    region: ohio
    plan: starter
    schedule: "30 22 * * 1-5"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.jobs.snapshot_prices
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.4"
      - key: DATABASE_URL
        sync: false
      - key: FINNHUB_API_KEY
        sync: false
