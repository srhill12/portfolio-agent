{% extends "base.html" %}
{% block title %}Dashboard · Portfolio Tracker{% endblock %}
{% block content %}
  <header>
    <div class="brand">Portfolio Tracker</div>
    <form action="/logout" method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
      <button type="submit">Sign out</button>
    </form>
  </header>
  <h1>Welcome{{ (", " ~ user.name) if user.name else "" }}</h1>
  <p>Your dashboard is ready. Holdings and analysis will show up here in later checkpoints.</p>
{% endblock %}
