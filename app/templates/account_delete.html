{% extends "base.html" %}
{% block title %}Delete account · Portfolio Tracker{% endblock %}
{% block content %}
  <header>
    <div class="brand">Portfolio Tracker</div>
    <a href="/dashboard">Back to dashboard</a>
  </header>
  <h1>Delete account</h1>
  <p>
    Delete {{ account.name }} ({{ account.type.value }}) and all of its holdings?
    This cannot be undone.
  </p>
  <form method="post" action="/accounts/{{ account.id }}/delete">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
    <div class="actions">
      <button type="submit">Delete account</button>
      <a class="button secondary" href="/dashboard">Cancel</a>
    </div>
  </form>
{% endblock %}
